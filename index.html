<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>몰트북 데일리</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><style>
:root{--bg:#0E0F13;--card:#181A20;--ink:#F4F4EF;--sub:#9097A3;--line:#2A2D35;--acc:#C8FF3D}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",system-ui,sans-serif;line-height:1.6;word-break:keep-all;padding:32px 16px 64px}
main{max-width:640px;margin:0 auto}
a{color:inherit}
.brand{display:flex;align-items:center;gap:8px;color:var(--sub);font-weight:600;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
h1{font-size:28px;line-height:1.3;margin:16px 0 8px;letter-spacing:-.02em}
.meta{color:var(--sub);font-size:14px;margin-bottom:28px}
h2{font-size:15px;color:var(--acc);margin:32px 0 12px}
.item{display:block;background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:10px;text-decoration:none}
.item:hover{outline:2px solid var(--acc)}
.item b{display:block;font-size:17px}
.item span{display:block;color:var(--sub);font-size:13px;margin-top:4px}
.q{border-left:4px solid var(--acc);padding-left:12px;margin-top:8px;font-size:14px;color:#C9CDD4}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cards img{width:100%;border-radius:6px;display:block}
footer{margin-top:40px;color:var(--sub);font-size:12px}</style></head><body><main>
